server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    location /models/ { expires 30d; add_header Cache-Control "public"; }
    location /lib/    { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(js|css|woff2|svg|png|jpe?g|gif|ico|webp|wasm|onnx)$ { expires 7d; add_header Cache-Control "public"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
